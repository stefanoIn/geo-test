experiment:
  name: croma_s1s2_fcn_all_hand_labels
  seed: 234

dataset:
  name: sen1floods11
  modalities: [sar, optical]

  train_csv: data/sen1floods11/splits/all_hand_labels/flood_train_data.csv
  val_csv: data/sen1floods11/splits/all_hand_labels/flood_valid_data.csv
  test_csv: data/sen1floods11/splits/all_hand_labels/flood_test_data.csv
  bolivia_csv: data/sen1floods11/splits/all_hand_labels/flood_bolivia_data.csv

model:
  name: croma
  size: large
  checkpoint: pretrained_models/croma/CROMA_large.pt
  modality: both
  feature_output: joint_encodings
  image_resolution: 120
  freeze_encoder: true

head:
  name: fcn
  in_channels: 1024
  num_classes: 2

preprocessing:
  normalization:
    method: two_sigma_stretch
    stats_file: configs/statistics/sen1floods11_train.yaml
    use_8_bit: false

  crop_size: 120

training:
  epochs: 100
  batch_size: 8
  num_workers: 0

  optimizer:
    name: adamw
    learning_rate: 0.0005
    weight_decay: 0.01

evaluation:
  batch_size: 1
  tile_size: 120
  tile_batch_size: 8
  checkpoint_metric: miou

output:
  directory: runs/sen1floods11/croma/fcn_s1s2
