# Upper-end constant-learning-rate candidate; validation selects the checkpoint.
experiment:
  name: croma_s1_fcn_tuning_lr0.005_wnone
  seed: 234
dataset:
  name: sen1floods11
  modalities:
  - sar
  train_csv: data/sen1floods11/splits/all_hand_labels/flood_train_data.csv
  val_csv: data/sen1floods11/splits/all_hand_labels/flood_valid_data.csv
model:
  name: croma
  size: large
  checkpoint: pretrained_models/CROMA_large.pt
  modality: SAR
  image_resolution: 120
  freeze_encoder: true
adapter:
  name: token_to_spatial
  feature_key: tokens
  grid_size: null
head:
  name: fcn
  in_channels: 1024
  num_classes: 2
preprocessing:
  normalization:
    method: two_sigma_stretch
    statistics: training_dataset
    use_8_bit: false
  band_indices:
    sar:
    - 0
    - 1
  crop_size: 120
training:
  epochs: 20
  batch_size: 8
  num_workers: 2
  validate_every: 5
  loss:
    name: cross_entropy
    ignore_index: 255
    class_weights: null
  optimizer:
    name: adamw
    learning_rate: 0.005
    weight_decay: 0.01
  scheduler:
    name: none
evaluation:
  aw_pw_fw: true
  batch_size: 1
  tile_size: 120
  stride: 60
  tile_batch_size: 8
  class_names:
  - non_water
  - water
  return_per_sample: true
  sample_id_key: chip_id
  checkpoint_metric: iou
  checkpoint_class: 1
output:
  directory: runs/sen1floods11/croma/tuning/s1/lr0.005_wnone
