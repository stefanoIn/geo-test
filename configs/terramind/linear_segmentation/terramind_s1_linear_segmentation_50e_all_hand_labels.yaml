
experiment:
  name: terramind_s1_linear_segmentation_50e_all_hand_labels
  seed: 234

dataset:
  name: sen1floods11
  modalities: [sar]
  train_csv: data/sen1floods11/splits/all_hand_labels/flood_train_data.csv
  val_csv: data/sen1floods11/splits/all_hand_labels/flood_valid_data.csv
  test_csv: data/sen1floods11/splits/all_hand_labels/flood_test_data.csv
  bolivia_csv: data/sen1floods11/splits/all_hand_labels/flood_bolivia_data.csv

model:
  name: terramind_v1_large
  size: large
  checkpoint: pretrained_models/TerraMind_v1_large.pt
  modalities: [S1GRD]
  input_mapping:
    sar: S1GRD
  merge_method: mean
  freeze_encoder: true

adapter:
  name: token_to_spatial
  feature_key: tokens
  grid_size: null

head:
  name: linear_segmentation
  in_channels: 1024
  num_classes: 2

preprocessing:
  normalization:
    method: zscore
    statistics: pretraining_fixed
    use_8_bit: false
  band_indices:
    sar: [0, 1]
  crop_size: 128

training:
  epochs: 50
  batch_size: 8
  num_workers: 0
  validate_every: 2

  loss:
    name: cross_entropy
    ignore_index: 255
    class_weights: null

  optimizer:
    name: adamw
    learning_rate: 0.001
    weight_decay: 0.01

  scheduler:
    name: cosine_annealing
    eta_min: 0.0

evaluation:
  aw_pw_fw: true
  batch_size: 1
  tile_size: 128 
  stride: 85                        # stride of 85 to allow an overlap of around 33%
  tile_batch_size: 8
  class_names: [non_water, water]
  return_per_sample: true
  sample_id_key: chip_id
  checkpoint_metric: miou

output:
  directory: runs/sen1floods11/terramind/linear_segmentation/s1_50e
