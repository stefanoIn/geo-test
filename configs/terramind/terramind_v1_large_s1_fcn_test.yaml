# Integration test only: run.py is not yet a model/training runner.
experiment:
  name: terramind_v1_large_s1_fcn_test
  seed: 234

model:
  name: terramind_v1_large
  size: large
  checkpoint: pretrained_models/TerraMind_v1_large.pt
  modalities: [S1GRD]
  input_mapping:
    sar: S1GRD
  merge_method: mean
  freeze_encoder: true

adapter:
  name: token_to_spatial
  feature_key: tokens
  grid_size: null

head:
  name: fcn
  in_channels: 1024
  num_classes: 2

test:
  input_size: 120
  batch_size: 1
