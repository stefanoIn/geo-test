# GeoTest baseline functional test: SAR-only input (2 bands), validation only
# Not a final benchmark or hyperparameter-optimization result.
experiment:
  name: unet_s1_only_3e
  seed: 234
dataset:
  name: sen1floods11
  modalities:
  - sar
  train_csv: data/sen1floods11/splits/all_hand_labels/flood_train_data.csv
  val_csv: data/sen1floods11/splits/all_hand_labels/flood_valid_data.csv
model:
  name: unet
  in_channels: 2
head:
  num_classes: 2
preprocessing:
  normalization:
    method: zscore
    statistics: training_dataset
    use_8_bit: false
  band_indices:
    sar:
    - 0
    - 1
  crop_size: 120
training:
  epochs: 3
  batch_size: 4
  num_workers: 0
  validate_every: 1
  loss:
    name: cross_entropy
    ignore_index: 255
    class_weights: null
  optimizer:
    name: adamw
    learning_rate: 0.0003
    weight_decay: 0.01
  scheduler:
    name: cosine_annealing
    eta_min: 0.0
evaluation:
  aw_pw_fw: false
  batch_size: 1
  tile_size: 120
  stride: 80
  tile_batch_size: 1
  class_names:
  - non_water
  - water
  return_per_sample: true
  sample_id_key: chip_id
  checkpoint_metric: miou
  save_predictions: false
output:
  directory: runs/sen1floods11/baselines/unet/unet_s1_only_3e
